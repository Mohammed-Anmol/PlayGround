<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Neon Strike</title>
  <style>
    :html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09091a;color:#fff;font-family:Impact,"Arial Black",system-ui,sans-serif}
    *{box-sizing:border-box;touch-action:none;user-select:none}
    body{background:radial-gradient(circle at 50% 60%,#24164d 0,#11112a 55%,#070711 100%)}
    #game{position:relative;width:100vw;height:100vh;overflow:hidden}
    canvas{display:block;width:100%;height:100%}
    #ui{position:absolute;inset:0;pointer-events:none}
    .hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:0;width:100%;display:flex;justify-content:space-between;align-items:flex-start;padding:0 3.2%;z-index:3}
    .side{width:41%;position:relative}.side.right{text-align:right}
    .name{font-size:clamp(13px,2vw,24px);letter-spacing:3px;text-shadow:3px 3px 0 #111;margin-bottom:5px}
    .barbg{height:clamp(18px,3vw,34px);background:#1a1530;border:3px solid #f4efdc;transform:skewX(-13deg);box-shadow:5px 5px 0 rgba(0,0,0,.45);overflow:hidden}
    .bar{height:100%;width:100%;transition:width .12s}.left .bar{background:linear-gradient(90deg,#20d9ff,#fff0 95%),linear-gradient(90deg,#078bd1,#62ecff)}.right .bar{background:linear-gradient(90deg,#ffe05a,#ff3155)}
    .meter{margin-top:7px;height:7px;width:70%;background:#252044;border:1px solid #a49eb5}.right .meter{margin-left:auto}.meter i{display:block;height:100%;width:0;background:#ffe55f;box-shadow:0 0 10px #ffea72}
    #timer{position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:clamp(58px,7vw,86px);height:clamp(58px,7vw,86px);border:4px solid #f4efdc;background:#15152d;clip-path:polygon(15% 0,85% 0,100% 16%,100% 84%,85% 100%,15% 100%,0 84%,0 16%);display:grid;place-items:center;font-size:clamp(28px,4vw,48px);text-shadow:3px 3px 0 #000}
    #round{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + clamp(62px,8vw,96px));left:50%;transform:translateX(-50%);font:700 12px system-ui,Arial;color:#d9d5e8;letter-spacing:3px}
    #banner{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:8;pointer-events:none;opacity:0}
    #banner.show{animation:flash 1.15s ease both}@keyframes flash{0%,100%{opacity:0}12%,75%{opacity:1}}
    #banner b{font-size:clamp(54px,11vw,150px);font-style:italic;letter-spacing:-5px;text-shadow:7px 7px 0 #e93465,12px 12px 0 #111}
    #select{position:absolute;inset:0;z-index:10;background:rgba(7,7,18,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;padding:20px}
    #select.hidden{display:none}#select h1{margin:0 0 4px;font-size:clamp(38px,7vw,82px);font-style:italic;letter-spacing:-3px;text-shadow:5px 5px 0 #e93465}#select p{margin:0 0 18px;font:700 12px system-ui;color:#aaa8c2;letter-spacing:4px}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);width:min(860px,92vw)}
    .card{height:clamp(230px,48vh,430px);border:2px solid #575171;background:linear-gradient(150deg,#24204a,#100f25);clip-path:polygon(7% 0,100% 0,100% 88%,93% 100%,0 100%,0 12%);cursor:pointer;position:relative;overflow:hidden;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;transition:.16s}.card:hover,.card.selected{border-color:#ffe55f;transform:translateY(-8px);box-shadow:0 12px 40px #000}.card canvas{position:absolute;inset:-10% 0 18%;width:100%;height:80%;pointer-events:none}.card h2{margin:0;font-size:clamp(18px,3vw,35px);font-style:italic;z-index:2}.card small{font:800 10px system-ui;letter-spacing:2px;color:#c8c3dd;z-index:2}.card em{position:absolute;top:12px;right:12px;font:900 10px system-ui;color:#ffe55f}.card .stats{z-index:2;margin-top:6px;font:700 9px system-ui;color:#aaa6bf}
    #start{margin-top:18px;border:0;background:#ef315e;color:white;font:900 20px Impact,Arial;letter-spacing:3px;padding:14px 44px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);cursor:pointer}
    #touch{display:none;position:absolute;inset:auto 0 max(8px,env(safe-area-inset-bottom));justify-content:space-between;padding:0 12px;pointer-events:none}
    .cluster{display:flex;align-items:flex-end;gap:7px}.touchbtn{pointer-events:auto;width:58px;height:58px;border:2px solid rgba(255,255,255,.28);border-radius:50%;background:rgba(20,18,48,.68);color:white;font:900 12px system-ui;display:grid;place-items:center}.touchbtn.wide{border-radius:12px;width:54px}.touchbtn:active{background:#e93465;transform:scale(.92)}
    @media(max-width:700px),(pointer:coarse){#touch{display:flex}.hud{top:max(7px,env(safe-area-inset-top));padding:0 2%}.side{width:43%}.meter{height:5px}.card{height:clamp(230px,50vh,360px)}.cards{width:min(680px,96vw)}#round{display:none}.touchbtn{width:50px;height:50px}}
  </style>
</head>
<body>
<div id="game"><canvas id="canvas"></canvas><div id="ui">
  <div class="hud"><div class="side left"><div class="name" id="p1name">RYU</div><div class="barbg"><div class="bar" id="hp1"></div></div><div class="meter"><i id="power1"></i></div></div><div id="timer">60</div><div class="side right"><div class="name" id="p2name">KAI</div><div class="barbg"><div class="bar" id="hp2"></div></div><div class="meter"><i id="power2"></i></div></div></div><div id="round">ROUND 1</div><div id="banner"><b>READY</b></div>
  <div id="touch"><div class="cluster"><div class="touchbtn" data-key="a">◀</div><div class="touchbtn" data-key="d">▶</div><div class="touchbtn" data-key="w">▲</div></div><div class="cluster"><div class="touchbtn wide" data-key="j">P</div><div class="touchbtn wide" data-key="k">K</div><div class="touchbtn wide" data-key="l">S1</div><div class="touchbtn wide" data-key="u">S2</div><div class="touchbtn wide" data-key="i">S3</div></div></div>
  <div id="select"><h1>NEON STRIKE</h1><p>CHOOSE YOUR FIGHTER</p><div class="cards" id="cards"></div><button id="start">FIGHT</button></div>
</div></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const chars=[
 {name:'RYU',style:'BALANCE',speed:3.2,power:1,body:'#f3a56b',hair:'#17243d',gi:'#eae4d3',accent:'#e04455',moves:['FLAME KICK','DRAGON FIST','VORTEX']},
 {name:'KAI',style:'SPEED',speed:4.1,power:.86,body:'#a96f58',hair:'#ec3f78',gi:'#222943',accent:'#44ccff',moves:['VOLT DASH','AERIAL CUT','NEON BURST']},
 {name:'VOLT',style:'POWER',speed:2.7,power:1.18,body:'#d1a188',hair:'#e7dfcf',gi:'#4d3972',accent:'#ffc942',moves:['IRON BREAK','EARTH SHOCK','SOLAR RUSH']}
];let chosen=0,started=false,mode='select';
const keys={};addEventListener('keydown',e=>{keys[e.key.toLower]=true;if(e.key.toLowerCase()==='r'&&mode==='over')reset()});addEventListener('keyup',e=>keys[e.key.toLower]=false);
function touchBind(){document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.prevent();keys[k]=true});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointercancel',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)})}touchBind();
function portrait(c,preview){return function(){}}
const cards=document.getElementById('cards');chars.forEach((c,i)=>{const d=document.createElement('div');d.className='card'+(i===0?' selected':'');d.innerHTML=`<canvas></canvas><em>${c.style}</em><h2>${c.name}</h2><small>${c.moves.join(' · ')}</small><div class="stats">SPD ${Math.round(c.speed*20)} &nbsp; POW ${Math.round(c.power*100)}</div>`;d.onclick=()=>{chosen=i;document.querySelectorAll('.card').forEach((x,j)=>x.classList.toggle('selected',j===i));drawPreviews()};cards.appendChild(d)});
function drawPreview(canvas,c){let w=canvas.width=300,h=canvas.height=300,pc=canvas.getContext('2d');pc.clearRect(0,0,w,h);pc.translate(150,285);pc.fillStyle='#09091b';pc.beginPath();pc.ellipse(0,5,95,16,0,0,Math.PI*2);pc.fill();drawFighter(pc,0,0,1.35,c,false,true)}
function drawPreviews(){document.querySelectorAll('.card').forEach((d,i)=>drawPreview(d.querySelector('canvas'),chars[i]))}setTimeout(drawPreviews,20);
function ground(){return H*.76}
class Fighter{constructor(x,c,p){this.x=x;this.y=ground();this.vx=0;this.vy=0;this.c=c;this.p=p;this.hp=100;this.power=25;this.dir=p===1?1:-1;this.face=this.dir;this.state='idle';this.anim=0;this.cool=0;this.attack=null;this.inv=0;this.jump=false}update(enemy,t){this.anim+=.06;this.cool=Math.max(0,this.cool-1);this.inv=Math.max(0,this.inv-1);if(this.state==='hurt'&&this.anim>12)this.state='idle';if(this.state==='attack'&&this.attack){let a=this.attack;if(this.anim>a.time){this.state='idle';this.attack=null}}const left=this.p===1?(keys.a||keys.ArrowLeft):(keys.ArrowLeft);const right=this.p===1?(keys.d||keys.ArrowRight):(keys.ArrowRight);const jump=this.p===1?(keys.w||keys.ArrowUp):(keys.ArrowUp);const punch=this.p===1?keys.j:false;const kick=this.p===1?keys.k:false;const s1=this.p===1?keys.l:false,s2=this.p===1?keys.u:false,s3=this.p===1?keys.i:false;
if(this.state!=='attack'&&this.state!=='hurt'){if(left){this.vx=-this.c.speed;this.face=-1;if(this.state==='idle')this.state='walk'}else if(right){this.vx=this.c.speed;this.face=1;if(this.state==='idle')this.state='walk'}else{this.vx*=.72;if(this.state==='walk')this.state='idle'}if(jump&&this.y>=ground()-1&&!this.jump){this.vy=-11.5;this.jump=true}if(punch&&this.cool===0)this.attackMove('punch',11,0,9);else if(kick&&this.cool===0)this.attackMove('kick',15,0,13);else if(s1&&this.cool===0&&this.power>=20)this.special('s1',14,55);else if(s2&&this.cool===0&&this.power>=35)this.special('s2',20,75);else if(s3&&this.cool===0&&this.power>=55)this.special('s3',28,120)}}
this.vy+=.55;this.y+=this.vy;if(this.y>ground()){this.y=ground();this.vy=0;this.jump=false}this.x+=this.vx;if(this.x<70)this.x=70;if(this.x>W-70)this.x=W-70;if(Math.abs(this.x-enemy.x)<40)this.x+=(this.x<enemy.x?-1:1)*(40-Math.abs(this.x-enemy.x));this.dir=(enemy.x>=this.x)?1:-1;if(this.state!=='attack'&&this.state!=='hurt'&&this.vx===0)this.state='idle';if(this.attack){let ar=this.attack;let dist=enemy.x-this.x;if(this.anim<ar.time&&Math.abs(dist)<(ar.range||58)&&((dist*this.face)>-15)){if(!ar.hit){ar.hit=true;enemy.damage(ar.damage,this.face)}}}}
attackMove(kind,damage,knock,range){this.state='attack';this.anim=0;this.cool=18;this.attack={kind,time:kind==='punch'?18:24,damage:damage*this.c.power,range,hit:false}};
special(kind,damage,range){this.state='attack';this.anim=0;this.cool=45;this.power-=kind==='s1'?20:kind==='s2'?35:55;this.attack={kind,time:kind==='s3'?38:30,damage:damage*this.c.power,range,hit:false};bursts.push({x:this.x+this.face*50,y:this.y-95,life:20,accent:this.c.accent,kind})}
damage(d,dir){if(this.inv)return;this.hp=Math.max(0,this.hp-d);this.power=Math.min(100,this.power+7);this.state='hurt';this.anim=0;this.vx=dir*7;this.inv=8;hitFlash=18;bursts.push({x:this.x,y:this.y-100,life:12,accent:'#fff',kind:'hit'})}}
let f1,f2,bursts=[],hitFlash=0,timer=60,tick=0,raf;
function reset(){started=true;mode='fight';document.getElementById('select').classList.add('hidden');f1=new Fighter(W*.27,chars[chosen],1);let ai=chars[(chosen+1)%3];f2=new Fighter(W*.73,ai,2);f1.dir=f2.dir=1;f2.c=ai;timer=60;tick=0;bursts=[];showBanner('READY');setTimeout(()=>showBanner('FIGHT'),800)}
document.getElementById('start').onclick=reset;
function showBanner(text){let b=document.getElementById('banner');b.innerHTML='<b>'+text+'</b>';b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
function drawBg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17113a');g.addColorStop(.62,'#30205a');g.addColorStop(.63,'#15152d');g.addColorStop(1,'#080812');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#20194b';for(let i=0;i<11;i++){let x=i*W/10-W*.08;ctx.fillRect(x,H*.23,W*.055,H*.40)}ctx.fillStyle='#0e0d23';ctx.fillRect(0,H*.66,W,H*.34);ctx.strokeStyle='rgba(119,98,180,.22)';ctx.lineWidth=2;for(let y=H*.68;y<H;y+=22){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=0;x<W;x+=90){ctx.beginPath();ctx.moveTo(W/2,H*.68);ctx.lineTo(x,H);ctx.stroke()}ctx.fillStyle='#ef3d70';ctx.fillRect(W*.43,H*.29,W*.14,7);ctx.fillStyle='#a9a2ca';ctx.font='900 14px system-ui';ctx.textAlign='center';ctx.fillText('METRO  -  11',W*.5,H*.25);ctx.fillStyle='#09091a';ctx.fillRect(W*.47,H*.66,W*.06,5)}
function drawFighter(c,x,y,s,ch,shadow=true,preview=false){c.save();c.translate(x,y);if(ch.dir<0)c.scale(-1,1);c.scale(s,s);if(shadow&&!preview){c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.ellipse(0,6,58,12,0,0,Math.PI*2);c.fill()}let st=preview?'idle':ch.state,cy=preview?0:0,bob=st==='walk'?Math.sin(ch.anim)*5:0;c.translate(0,-bob);
// back leg
c.fillStyle='#16182a';c.beginPath();c.moveTo(-22,-86);c.lineTo(-35,-155);c.lineTo(-12,-155);c.lineTo(6,-83);c.fill();c.fillStyle='#eee8d9';c.fillRect(-24,-91,46,20);c.fillStyle='#17182a';c.fillRect(-35,-74,25,12);
// body
c.fillStyle=ch.c.gi;c.beginPath();c.moveTo(-38,-220);c.lineTo(38,-220);c.lineTo(48,-110);c.lineTo(-45,-110);c.closePath();c.fill();c.fillStyle=ch.c.accent;c.fillRect(-40,-142,80,14);c.fillStyle='#d7d0bd';c.beginPath();c.moveTo(-2,-216);c.lineTo(2,-145);c.lineTo(-17,-145);c.lineTo(-29,-205);c.fill();
// head
c.fillStyle=ch.c.body;c.beginPath();c.arc(0,-247,35,0,Math.PI*2);c.fill();c.fillStyle=ch.c.hair;c.beginPath();c.moveTo(-36,-260);c.quadraticCurveTo(-30,-302,15,-292);c.quadraticCurveTo(42,-280,32,-245);c.lineTo(18,-270);c.lineTo(-32,-263);c.fill();c.fillStyle='#17182a';c.fillRect(-8,-251,26,6);c.fillStyle='#e8b39a';c.fillRect(-31,-244,12,5);
// arms
let attacking=st==='attack',kick=st==='kick';c.fillStyle=ch.c.body;c.save();if(attacking&&ch.attack){let t=ch.anim;let ext=Math.min(t/8,1);c.translate(30,-195);c.rotate(-1.1+ext*.9);c.fillRect(-8,0,18,75);c.fillStyle='#111';c.fillRect(-10,65,24,12)}else{c.save();c.translate(-32,-198);c.rotate(.2);c.fillRect(-8,0,18,78);c.restore();c.save();c.translate(32,-198);c.rotate(-.2);c.fillRect(-8,0,18,78);c.restore()}c.restore();
// legs
c.fillStyle='#17182a';c.beginPath();c.moveTo(-28,-112);c.lineTo(-48,-58);c.lineTo(-18,-58);c.lineTo(2,-112);c.fill();c.beginPath();c.moveTo(20,-112);c.lineTo(38,-58);c.lineTo(68,-58);c.lineTo(26,-112);c.fill();c.fillStyle=ch.c.accent;c.fillRect(-50,-58,35,13);c.fillRect(38,-58,35,13);
if(attacking&&ch.attack&&ch.attack.kind==='kick'){c.fillStyle='#17182a';c.save();c.translate(20,-105);c.rotate(-1.1);c.fillRect(0,0,22,110);c.fillStyle=ch.c.accent;c.fillRect(-2,96,38,14);c.restore()}c.restore()}
function draw(){drawBg();if(f1&&f2){drawFighter(ctx,f1.x,f1.y,1,f1,true);drawFighter(ctx,f2.x,f2.y,1,f2,true);bursts.forEach((b,i)=>{ctx.save();ctx.globalAlpha=Math.max(0,b.life/20);ctx.fillStyle=b.accent;ctx.shadowBlur=24;ctx.shadowColor=b.accent;if(b.kind==='hit'){ctx.beginPath();ctx.arc(b.x,b.y,18+b.life,0,Math.PI*2);ctx.fill()}else{ctx.translate(b.x,b.y);ctx.rotate(b.life*.18);ctx.fillRect(-45,-8,90,16);ctx.beginPath();ctx.moveTo(-40,0);ctx.lineTo(-80,-28);ctx.lineTo(-70,20);ctx.fill()}ctx.restore();b.life--});bursts=bursts.filter(b=>b.life>0)}
if(hitFlash>0){ctx.fillStyle=`rgba(255,255,255,${hitFlash/70})`;ctx.fillRect(0,0,W,H);hitFlash--}}
function loop(){if(started&&mode==='fight'){tick++;if(tick%60===0&&timer>0){timer--;document.getElementById('timer').textContent=timer;if(timer===0)finish()}if(f1&&f2){f1.update(f2,tick);f2.update(f1,tick);document.getElementById('hp1').style.width=f1.hp+'%';document.getElementById('hp2').style.width=f2.hp+'%';document.getElementById('power1').style.width=f1.power+'%';document.getElementById('power2').style.width=f2.power+'%';if(f1.hp<=0||f2.hp<=0)finish()}}draw();raf=requestAnimationFrame(loop)}
function finish(){if(mode==='over')return;mode='over';let text=f1.hp===f2.hp?'DRAW':f1.hp>f2.hp?'RYU WINS':'KAI WINS';showBanner(text+'<br><small style="font-size:18px">R TO REMATCH</small>')}loop();
</script>
</body>
</html>
